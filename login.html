<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sim</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>

        <form>
            <div class="form-control">
                <label for="login">Login: </label>
                <input type="text" id="login"placeholder="Digite seu login"/>
            </div>

            <div class="form-control">
                <label for="email">Email: </label>
                <input type="email" id="email"placeholder="Digite seu Email"/>
            </div>

            <div class="form-control">
                <label for="senha">Senha: </label>
                <input type="text" id="senha"placeholder="Digite sua senha"/>
            </div>

            <div class="form-control">
                <div class="opcoes">
                    <input type="checkbox" id="lembrar" />
                    <label for="lembrar">Lembrar meu login</label>
                </div>
            </div>

            <div class="form-contro">
                <label>Tipo de acesso: </label>
                <div class="opcoes">
                    <input type="radio" id="aluno" name="tipo " value="aluno" />
                    <label for="aluno">Aluno</label>

                    <input type="radio" name="tipo" id="professor" value="professor" />
                    <label for="professor">Professor</label>
                </div>
            </div>

            <div class="form-control">
                <label for="cidade">Cidade: </label>
                
                <select id="cidade">
                    <option value="">Selecione sua cidade</option>
                    <option value="Jundiai">Jundiai</option>
                    <option value="sao-paulo">São Paulo</option>
                    <option value="cotia">Cotia</option>
                </select>

                <div class="form-control">
                    <button type="submit">Entrar</button>
                </div>

            </div>
            <br>
            <a href="senha.html">Esqueceu a senha?</a>
        </form>
    </div>

</body>
</html>
